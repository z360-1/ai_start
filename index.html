<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI Start</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}/* жаңа тапсырма түрлері + Robo чаты */
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt>div{display:flex;flex-direction:column;gap:8px}.mt .opt.used{opacity:.55}.mt .as{margin-left:auto;font-weight:800;color:var(--lilac-deep)}
.tfl{display:flex;flex-direction:column;gap:8px}.tfr{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:2px solid var(--line);border-radius:14px;padding:10px 12px}.tfr>span:first-child{flex:1 1 220px}.tfb{display:flex;gap:6px}
.chip.good{border-color:var(--good);background:var(--good-soft)}.chip.bad{border-color:var(--bad);background:var(--bad-soft)}
@media(max-width:560px){.mt{grid-template-columns:1fr}}
#robo{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#robob{width:66px;height:66px;border-radius:50%;border:2px solid var(--blue);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:0 10px 24px -8px var(--shadow)}#robob .robot{width:44px}
#robop{width:min(380px,calc(100vw - 32px));height:min(540px,calc(100vh - 150px));display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--line);border-radius:20px;box-shadow:0 20px 50px -16px var(--shadow);overflow:hidden}
.rh{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--blue);color:#fff;font:800 1.05rem var(--f-body)}.rh .robot{width:30px;background:#fff;border-radius:10px;padding:2px}.rh button{margin-left:auto;border:0;background:transparent;color:#fff;font-size:1.1rem;cursor:pointer}
#rmsgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.rm{max-width:86%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem}.rm.b{background:var(--blue-soft);align-self:flex-start}.rm.u{background:var(--solid);color:var(--on-solid);align-self:flex-end}
.rq{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}.rq .chip{font-size:.8rem;padding:6px 10px}
.rf{display:flex;gap:8px;padding:10px;border-top:2px solid var(--line)}.rf input{flex:1;min-width:0;border:2px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;background:var(--bg);color:var(--ink)}
</style></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: ойын-лабиринт. Басты бетте таныстыру + бүйір панелі бар тігінен иілген лабиринт карта;
   сабақ беті төрт қадамнан тұрады (теория, видео, практика, тест), оң жақта робот-нұсқаушы. */
:root{
  --bg:#f5f7ff; --surface:#ffffff; --ink:#142044; --muted:#5a6788; --line:#d9e1f4;
  --blue:#2f74b8; --blue-deep:#1c4f8c; --blue-soft:#e2eefb;
  --lilac:#b8a6f2; --lilac-deep:#6f55d8; --lilac-soft:#ece8fb;
  --pill:#d6e0f2; --solid:#1f5a9e; --on-solid:#ffffff;
  --good:#1c9a68; --good-soft:#dff5ec; --bad:#d23f5d; --bad-soft:#fde5ea;
  --lock:#b9c3dd;--tcard:#3a7fb8;--board-a:#2f74b8;--board-b:#6a5bd0;--lane:#eef2ff; --grid:rgba(47,116,184,.10); --shadow:rgba(28,79,140,.28);
  --f-display:'Lora',Georgia,'Times New Roman',serif;
  --f-body:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1330; --surface:#161f47; --ink:#eaf0ff; --muted:#a4b1d8; --line:#2b3a6f;
    --blue:#6aa8f0; --blue-deep:#8dbbf5; --blue-soft:#1a2c5a;
    --lilac:#8c7be6; --lilac-deep:#b7a9ff; --lilac-soft:#251f55;
    --pill:#243a72; --solid:#5b95e6; --on-solid:#0b1233;
    --good:#4cd6a0; --good-soft:#12382f; --bad:#ff7d97; --bad-soft:#40202e;
    --lock:#3a4678;--tcard:#27549a;--board-a:#1b3d78;--board-b:#3e3a94;--lane:#2a3a78; --grid:rgba(106,168,240,.12); --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1330; --surface:#161f47; --ink:#eaf0ff; --muted:#a4b1d8; --line:#2b3a6f;
  --blue:#6aa8f0; --blue-deep:#8dbbf5; --blue-soft:#1a2c5a;
  --lilac:#8c7be6; --lilac-deep:#b7a9ff; --lilac-soft:#251f55;
  --pill:#243a72; --solid:#5b95e6; --on-solid:#0b1233;
  --good:#4cd6a0; --good-soft:#12382f; --bad:#ff7d97; --bad-soft:#40202e;
  --lock:#3a4678;--tcard:#27549a;--board-a:#1b3d78;--board-b:#3e3a94;--lane:#2a3a78; --grid:rgba(106,168,240,.12); --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;position:relative}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#shell{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding-bottom:40px}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit}
.muted{color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:12px 0;
  background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px)}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;color:var(--blue-deep);font:700 1.5rem var(--f-display);padding:0}
.logo .lg{width:38px;height:38px;border-radius:12px;background:var(--blue);display:grid;place-items:center}
.logo .lg svg{width:26px;height:26px}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:800 .85rem var(--f-body)}
.pill b{color:var(--blue-deep)}
.auth{margin-top:6px;font-weight:800;color:var(--blue-deep)}
.vbtnrow{margin:0 0 14px}#vwrap{margin-bottom:18px}
.iconbtn{cursor:pointer}
.iconbtn:hover{border-color:var(--blue)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* buttons */
.btn{font:800 .85rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--blue-deep);background:var(--pill);color:var(--blue-deep);
  padding:.8rem 1.5rem;border-radius:999px;cursor:pointer;transition:transform .15s,box-shadow .15s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 18px -10px var(--shadow)}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.node:focus-visible{outline:3px solid var(--lilac-deep);outline-offset:2px}
.btn.solid{background:var(--solid);border-color:var(--solid);color:var(--on-solid)}
.btn.small{padding:.5rem 1rem;font-size:.75rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding:28px 0 18px}
.eyebrow{font:800 .8rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--lilac-deep)}
.hero h1{font:700 clamp(3.4rem,10vw,6.2rem)/1 var(--f-display);color:var(--blue-deep);margin:10px 0 14px;letter-spacing:-.01em}
.hero h1 span{background:linear-gradient(transparent 62%,var(--lilac-soft) 62%);padding:0 .08em}
.lead{font-size:1.15rem;max-width:34em;color:var(--ink)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.rstage{position:relative;display:grid;place-items:center;min-width:0;padding:10px}
.rstage::before{content:"";position:absolute;inset:6% 8%;border-radius:50%;background:var(--lilac-soft);animation:breathe 6s ease-in-out infinite}
.rstage::after{content:"";position:absolute;inset:2% 4%;border-radius:50%;border:3px dashed var(--lilac);opacity:.7;animation:spin 40s linear infinite}
.rstage .robot{position:relative;width:min(58%,230px);z-index:2}
.bubble{position:relative;z-index:3;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 18px;font-weight:600;max-width:420px;min-height:92px;box-shadow:0 14px 28px -18px var(--shadow);margin-bottom:6px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;width:20px;height:20px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.bnav{display:flex;align-items:center;justify-content:center;gap:8px;position:relative;z-index:3;margin-top:12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);border:0;padding:0;cursor:pointer}
.dot.on{background:var(--blue);width:22px;border-radius:6px}

/* robot */
.robot{display:block;height:auto;overflow:visible}
.robot.float{animation:floaty 4s ease-in-out infinite}
.robot .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.robot .wave{transform-box:view-box;transform-origin:150px 134px;animation:wave 2.4s ease-in-out infinite}
.robot .ant{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.robot.talk .mouth{animation:talk .35s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

/* sections */
section{padding:30px 0}
.sh{margin-bottom:18px}
.sh h2{font:700 clamp(1.7rem,4vw,2.4rem)/1.15 var(--f-display);color:var(--blue-deep);border-bottom:2px solid var(--line);padding-bottom:8px;text-wrap:balance}
.sh p{margin-top:8px;color:var(--muted);max-width:46em}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;list-style:none;margin:0;padding:0;counter-reset:f}
.flow li{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.flow li:not(:last-child)::after{content:"→";position:absolute;right:-14px;top:50%;transform:translateY(-50%);font:800 1.1rem var(--f-body);color:var(--lilac-deep);z-index:2;background:var(--bg);width:14px;text-align:center}
.flow .fi{width:46px;height:46px;border-radius:14px;background:var(--blue);display:grid;place-items:center;color:#fff}
.flow .fi svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.flow h3{font:800 1.05rem var(--f-body);color:var(--blue-deep)}
.flow p{font-size:.9rem;color:var(--muted)}

/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:26px;align-items:start}
.mapbox{background:var(--surface);border:2px solid var(--line);border-radius:28px;padding:16px 8px;display:grid;place-items:center;min-width:0}
.mapsvg{width:100%;max-width:440px;height:auto;display:block}
.mapsvg text{font-family:var(--f-body)}
.node{cursor:pointer;outline:none}
.node .circ{transition:transform .2s;transform-box:fill-box;transform-origin:center}
.node:hover .circ,.node:focus-visible .circ{transform:scale(1.08)}
.pulse{fill:none;stroke:var(--lilac-deep);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
.bob{animation:bob 1.2s ease-in-out infinite}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);display:flex;flex-direction:column;gap:16px;min-width:0}
.pcard{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px;display:flex;gap:16px;align-items:center}
.ring{width:84px;height:84px;flex:none}
.ring text{font:800 20px var(--f-body);fill:var(--blue-deep)}
.tcard{background:var(--blue);color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
:root[data-theme="dark"] .tcard{background:#27549a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tcard{background:#27549a}}
.tcard .trow{display:flex;gap:12px;align-items:flex-start}
.tcard h3{font:700 1.2rem/1.25 var(--f-display);font-style:italic}
.tcard .btn{background:#d6e0f2;color:#1c4f8c;border-color:#1c4f8c}
.num{flex:none;width:34px;height:34px;border-radius:10px;background:#fff;color:#142044;font:800 1.05rem var(--f-body);display:grid;place-items:center}

/* lesson */
.lbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 0 14px}
.ltitle{display:flex;align-items:center;gap:12px;min-width:0}
.ltitle .num{background:var(--blue);color:#fff;width:40px;height:40px;border-radius:12px}
.ltitle h2{font:700 clamp(1.4rem,3.4vw,2rem)/1.2 var(--f-display);color:var(--blue-deep);text-wrap:balance}
.stepper{display:flex;gap:0;list-style:none;margin:0 0 18px;padding:0}
.stepper li{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font:800 .78rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;min-width:0}
.stepper li::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:4px;background:var(--line);z-index:0;border-radius:2px}
.stepper li:first-child::before{display:none}
.stepper li.done::before,.stepper li.on::before{background:var(--blue)}
.stepper .sd{width:34px;height:34px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;z-index:1;font-size:.9rem;color:var(--muted)}
.stepper li.on .sd{border-color:var(--blue);color:var(--blue-deep);box-shadow:0 0 0 5px var(--blue-soft)}
.stepper li.done .sd{background:var(--blue);border-color:var(--blue);color:#fff}
.stepper li.on,.stepper li.done{color:var(--blue-deep)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px;align-items:start}
.lmain{min-width:0}
.coach{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);display:flex;flex-direction:column;align-items:center;gap:10px}
.coach .robot{width:120px}
.coach .bubble{min-height:0;font-size:.92rem;padding:12px 14px}
.lnav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:22px}

.theory{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:22px;align-items:start}
.scene{position:relative;border-radius:28px;aspect-ratio:1/1;background:linear-gradient(150deg,var(--blue-soft),var(--lilac-soft));overflow:hidden;border:2px solid var(--line);max-width:100%}
.scene::before,.scene::after{content:"";position:absolute;border-radius:50%;background:var(--lilac);opacity:.28;animation:floaty 7s ease-in-out infinite}
.scene::before{width:42%;height:42%;left:-10%;top:-8%}
.scene::after{width:30%;height:30%;right:-6%;bottom:12%;background:var(--blue);animation-delay:-3s}
.scene .pic{position:absolute;inset:12% 24% 28% 10%;z-index:2}
.scene .rb{position:absolute;right:3%;bottom:2%;width:34%;z-index:3}
.scene .tag{position:absolute;z-index:4;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font:800 .78rem var(--f-body);color:var(--blue-deep);animation:floaty 5s ease-in-out infinite}
.pic svg{width:100%;height:100%;display:block;color:var(--blue-deep);fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.pic svg *{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s .1s ease forwards}
.tcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.tcol .lead{font-size:1.08rem}
.pt{border-left:5px solid var(--lilac);background:var(--surface);border-radius:4px 16px 16px 4px;padding:10px 14px}
.pt h4{font:800 .98rem var(--f-body);color:var(--blue-deep)}
.pt p{font-size:.96rem}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.term{background:var(--blue-soft);border-radius:14px;padding:8px 12px}
.term b{display:block;color:var(--blue-deep);font-size:.95rem}
.term span{font-size:.85rem;color:var(--muted)}
.fact{background:var(--lilac-soft);border-radius:18px;padding:12px 16px;font-weight:600;display:flex;gap:12px;align-items:flex-start}
.fact i{flex:none;font:800 .75rem var(--f-body);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--lilac-deep);padding-top:3px}
pre{margin:0;background:#12204f;color:#d9e6ff;border-radius:14px;padding:12px 14px;overflow-x:auto;font:600 .82rem/1.55 ui-monospace,Menlo,Consolas,monospace}

.lab{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.lab h4{font:800 1rem var(--f-body);color:var(--blue-deep)}
.lab .sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.lab label{font:800 .8rem var(--f-body);color:var(--muted);display:flex;flex-direction:column;gap:2px}
.lab label b{color:var(--ink);font-size:.95rem}
.lab input[type=range]{width:100%;accent-color:var(--lilac-deep)}
.lab select,.fld input,.fld textarea,.tin{font:600 1rem var(--f-body);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:9px 12px;width:100%}
.lab svg{width:100%;height:auto;max-height:200px}
.lab svg text{font:800 13px var(--f-body);fill:var(--ink)}
.res{font-weight:800;color:var(--blue-deep)}

/* video */
.stage{position:relative;border-radius:28px;overflow:hidden;min-height:340px;display:grid;place-items:center;text-align:center;padding:26px 22px 60px;border:2px solid var(--line);
  background-color:var(--blue-soft);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),radial-gradient(circle at 20% 15%,var(--lilac-soft),transparent 55%),radial-gradient(circle at 85% 85%,var(--blue-soft),transparent 55%);
  background-size:38px 38px,38px 38px,100% 100%,100% 100%;animation:grid 8s linear infinite}
.stage .sc{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:520px;animation:fadein .6s ease both}
.stage .pic{width:150px;height:150px}
.stage h3{font:700 clamp(1.4rem,3.5vw,1.9rem)/1.2 var(--f-display);color:var(--blue-deep)}
.stage p{font-size:1.05rem;font-weight:600}
.stage .vr{position:absolute;left:14px;bottom:50px;width:62px}
.vctl{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.vbar{flex:1;min-width:140px;height:10px;border-radius:6px;background:var(--line);overflow:hidden;cursor:pointer}
.vbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--lilac-deep))}
.vdots{display:flex;gap:6px}
.extra{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.extra li{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 14px;list-style:none}
.extra ul{margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

/* practice + test */
.task{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px}
.task.ok{border-color:var(--good)}
.task.bad{border-color:var(--bad)}

function tone(f,t0,d,type,vol,f2){const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.05);}
function sfx(k){if(!state.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  if(k==='ok'){tone(660,0,.14,'sine',.2);tone(990,.12,.26,'sine',.2);}
  else if(k==='bad'){tone(230,0,.32,'sawtooth',.13,110);tone(170,.12,.38,'square',.08,80);}
  else if(k==='click'){tone(520,0,.07,'triangle',.09);}
  else if(k==='lock'){tone(190,0,.14,'square',.09);tone(150,.1,.16,'square',.09);}
  else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.28,'triangle',.18));}
 }catch(e){}}

(function(){const c=$('#bg');const x=c.getContext&&c.getContext('2d');if(!x)return;let w=0,h=0,pts=[],dpr=1,col={a:'#2f74b8',b:'#b8a6f2'},fr=0;
  function colors(){const cs=getComputedStyle(document.documentElement);col.a=cs.getPropertyValue('--blue').trim()||col.a;col.b=cs.getPropertyValue('--lilac').trim()||col.b;}
  function rs(){dpr=Math.min(window.devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.max(18,Math.min(60,Math.round(w*h/24000)));pts=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:2+Math.random()*3,k:Math.random()<.5}));}
  function draw(){x.clearRect(0,0,w,h);fr++;if(fr%120===1)colors();
    for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;}
    x.lineWidth=1;
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<150){x.globalAlpha=(1-d/150)*.22;x.strokeStyle=col.a;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();}}
    for(const p of pts){x.globalAlpha=.4;x.fillStyle=p.k?col.a:col.b;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill();}
    x.globalAlpha=1;if(!reduce())requestAnimationFrame(draw);}
  colors();rs();addEventListener('resize',rs);draw();})();

   <label>b <b id="lbv">-1</b><input type="range" id="lb" min="-5" max="5" step="0.5" value="-1"></label>
   <label>Активация<select id="lact"><option value="relu">ReLU</option><option value="sig">Сигмоида</option><option value="none">Жоқ</option></select></label></div>
  <svg id="lsvg" viewBox="0 0 420 170" aria-label="Нейрон сызбасы"></svg><p class="res" id="lres"></p></div>`;}
function bindLab(){
  const g=id=>$('#'+id);const ids=['lx1','lx2','lw1','lw2','lb'];

    const [x1,x2,w1,w2,b]=v,z=w1*x1+w2*x2+b,a=g('lact').value;let y=z;if(a==='relu')y=Math.max(0,z);if(a==='sig')y=1/(1+Math.exp(-z));

    g('lsvg').innerHTML=`<line x1="60" y1="40" x2="210" y2="85" stroke="${cl(w1)}" stroke-width="${sw(w1)}"/><line x1="60" y1="130" x2="210" y2="85" stroke="${cl(w2)}" stroke-width="${sw(w2)}"/>
     <line x1="250" y1="85" x2="360" y2="85" stroke="var(--lilac-deep)" stroke-width="3"/>
     <circle cx="40" cy="40" r="22" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="3"/><text x="40" y="45" text-anchor="middle">${x1}</text>

     <circle cx="230" cy="85" r="30" fill="var(--lilac-soft)" stroke="var(--lilac-deep)" stroke-width="3"/><text x="230" y="90" text-anchor="middle">z=${+z.toFixed(2)}</text>
     <circle cx="385" cy="85" r="26" fill="var(--good-soft)" stroke="var(--good)" stroke-width="3"/><text x="385" y="90" text-anchor="middle">${+y.toFixed(2)}</text>
     <text x="130" y="52" text-anchor="middle">w₁=${w1}</text><text x="130" y="128" text-anchor="middle">w₂=${w2}</text>`;
    g('lres').textContent=`z = ${w1}·${x1} + ${w2}·${x2} + (${b}) = ${+z.toFixed(2)}  →  шығыс y = ${+y.toFixed(3)}`;}

function defPlan(){return {name:'',one:'',problem:'',solution:'',audience:'',channels:[],price:2500,vc:500,fixed:300000,units:400,team:'',risks:'',plan90:'',made:false,c_dev:150000,c_eq:200000,c_mk:100000,c_leg:50000,c_oth:50000,months:3,own:300000,growth:8};}

const fmt=n=>Number.isFinite(n)?Math.round(n).toLocaleString('ru-RU'):'—';
function fin(p){const price=+p.price||0,vc=+p.vc||0,fx=+p.fixed||0,u=+p.units||0,m=price-vc,be=m>0?Math.ceil(fx/m):null,rev=price*u,cost=fx+vc*u,profit=rev-cost;return {price,vc,fx,u,m,be,rev,cost,profit,roi:cost>0?profit/cost*100:0};}
const COSTS=[['Өнімді жасау (бағдарлама, дизайн)','c_dev'],['Құрал-жабдық (ноутбук, телефон)','c_eq'],['Алғашқы жарнама','c_mk'],['Тіркеу және құжаттар','c_leg'],['Басқа шығындар','c_oth']];

function startup(p){const items=COSTS.map(c=>[c[0],c[1],Math.max(0,+p[c[1]]||0)]),months=Math.max(0,+p.months||0),reserve=(+p.fixed||0)*months,sum=items.reduce((a,x)=>a+x[2],0);return {items,months,reserve,sum,total:sum+reserve};}
function sim(p,mult,total){const f=fin(p),g=(+p.growth||0)/100,N=24;let cum=-total,arr=[cum],pb=null;
  for(let m=1;m<=N;m++){const u=f.u*mult*Math.pow(1+g,m-1);cum+=f.m*u-f.fx;arr.push(cum);if(pb==null&&cum>=0)pb=m;}
  return {arr,pb,N};}

function drawFin(){const host=$('#fin');if(!host)return;const p=L.plan,f=fin(p),s=startup(p),sc=L.scn==null?1:L.scn,MULT=[.6,1,1.4],SN=['Пессимист (−40%)','Базалық','Оптимист (+40%)'],sm=sim(p,MULT[sc],s.total);

  let chart='';
  if(f.price>0&&f.m>0){const xMax=niceMax(Math.max(f.u,f.be||0,10)*1.4),yMax=niceMax(Math.max(f.price*xMax,f.fx+f.vc*xMax)),W=520,H=250,l=62,r=14,t=14,b=34;
    const X=v=>l+v/xMax*(W-l-r),Y=v=>H-b-v/yMax*(H-t-b);let g='';
    for(let i=0;i<=4;i++){const yv=yMax*i/4,xv=xMax*i/4;g+=`<line x1="${l}" x2="${W-r}" y1="${Y(yv)}" y2="${Y(yv)}" stroke="var(--line)"/><text x="${l-6}" y="${Y(yv)+4}" text-anchor="end">${fmt(yv)}</text><text x="${X(xv)}" y="${H-b+16}" text-anchor="middle">${fmt(xv)}</text>`;}

    chart=`<h4 class="bh" style="font-size:1.05rem;margin-top:10px">Нөлдік нүкте: табыс пен шығын</h4><div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Табыс пен шығын графигі">${g}
      <line x1="${X(0)}" y1="${Y(0)}" x2="${X(xMax)}" y2="${Y(f.price*xMax)}" stroke="var(--blue)" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="${X(0)}" y1="${Y(f.fx)}" x2="${X(xMax)}" y2="${Y(f.fx+f.vc*xMax)}" stroke="var(--lilac-deep)" stroke-width="3.5" stroke-linecap="round"/>
      ${bx}<text x="${W-r}" y="${Y(f.price*xMax)+14}" text-anchor="end" style="fill:var(--blue)">Табыс</text><text x="${W-r}" y="${Y(f.fx+f.vc*xMax)-6}" text-anchor="end" style="fill:var(--lilac-deep)">Шығын</text>

  /* жиналған ақша графигі */

  let g2='';[lo,0,hi].forEach(v=>{g2+=`<line x1="${l2}" x2="${W2-r2}" y1="${Y2(v)}" y2="${Y2(v)}" stroke="${v===0?'var(--muted)':'var(--line)'}" ${v===0?'stroke-dasharray="5 5"':''}/><text x="${l2-6}" y="${Y2(v)+4}" text-anchor="end">${fmt(v)}</text>`;});

  const pbm=sm.pb!=null?`<circle cx="${X2(sm.pb)}" cy="${Y2(arr[sm.pb])}" r="6" fill="var(--good)" stroke="var(--surface)" stroke-width="2"/><text x="${Math.min(X2(sm.pb)+8,W2-110)}" y="${Y2(arr[sm.pb])-10}" style="fill:var(--good)">${sm.pb}-ай: өтелді</text>`:'';
  const cash=`<h4 class="bh" style="font-size:1.05rem;margin-top:14px">Ақшаң қашан қайтады? (24 ай)</h4><div class="scn">${SN.map((n,i)=>`<button class="chip tg ${i===sc?'on':''}" data-act="scn" data-i="${i}" aria-pressed="${i===sc}">${n}</button>`).join('')}</div>
   <div class="chartbox"><svg viewBox="0 0 ${W2} ${H2}" role="img" aria-label="Жиналған ақша графигі">${g2}<polyline points="${pts}" fill="none" stroke="var(--lilac-deep)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>${pbm}<text x="${(l2+W2-r2)/2}" y="${H2-2}" text-anchor="middle">ай</text></svg></div>
   <div class="fb ${sm.pb!=null?'ok':'bad'}">${sm.pb!=null?`Бастапқы ${fmt(s.total)} ₸ шығын ${sm.pb}-айда өтеледі.`:`24 айда шығын өтелмейді. Бағаны көтеріп, шығынды азайтып немесе сатылымды арттырып көр.`}<small>24-айдағы жиналған нәтиже: ${fmt(arr[sm.N])} ₸. Сатылым әр ай сайын ${+p.growth||0}% өседі деп есептелген.</small></div>`;

function planText(p){const f=fin(p),s=startup(p),sm=sim(p,1,s.total),gap=Math.max(0,s.total-(+p.own||0));return `${p.name} — бизнес жоспар\n${p.one}\n\nМӘСЕЛЕ\n${p.problem}\n\nШЕШІМ\n${p.solution}\n\nАУДИТОРИЯ\n${p.audience}\n\nЖАРНАМА АРНАЛАРЫ\n${p.channels.join(', ')}\n\nБАСТАПҚЫ ШЫҒЫН\n${s.items.map(x=>x[0]+': '+fmt(x[2])+' ₸').join('\n')}\nРезерв (${s.months} ай): ${fmt(s.reserve)} ₸\nЖАЛПЫ КЕРЕК: ${fmt(s.total)} ₸. Өз қаражат: ${fmt(+p.own||0)} ₸. Жетіспейді: ${fmt(gap)} ₸.\n\nҚАРЖЫ\nБаға: ${fmt(f.price)} ₸; айнымалы шығын: ${fmt(f.vc)} ₸; тұрақты шығын: ${fmt(f.fx)} ₸/ай; сатылым: ${fmt(f.u)}/ай.\nНөлдік нүкте: ${fmt(f.be)} бірлік. Айлық табыс: ${fmt(f.rev)} ₸. Айлық пайда: ${fmt(f.profit)} ₸.\nӨтелу мерзімі: ${sm.pb!=null?sm.pb+' ай':'24 айдан артық'}.\n\nКОМАНДА\n${p.team}\n\nТӘУЕКЕЛДЕР\n${p.risks}\n\n90 КҮНДІК ЖОСПАР\n${p.plan90}`;}

  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('tin')){const i=parseInt(e.target.dataset.i,10);if(L&&L.ts[i]&&!L.ts[i].checked)checkTask(i,false);}});
document.addEventListener('keydown',e=>{});




/* ============ Robo чаты ============ */
(function(){
const root=document.createElement('div');root.id='robo';
root.innerHTML=`<div id="robop" hidden role="dialog" aria-label="Robo"><div class="rh">${robot('')}<span>Robo</span><button id="rx" aria-label="Жабу">✕</button></div><div id="rmsgs" aria-live="polite"></div><div class="rq" id="rq">${['Жасанды интеллект деген не?','Нейрон қалай жұмыс істейді?','Стартап идеясын ұсын'].map(x=>`<button class="chip" type="button">${x}</button>`).join('')}</div><div class="rf"><input id="rin" type="text" autocomplete="off" placeholder="Сұрағыңды жаз…" aria-label="Сұрағыңды жаз…"><button class="btn small solid" id="rgo" type="button">Жіберу</button></div></div><button id="robob" type="button" aria-label="Robo-дан сұра" aria-expanded="false">${robot('float')}</button>`;
document.body.appendChild(root);
const q=s=>root.querySelector(s),box=q('#rmsgs'),inp=q('#rin'),pan=q('#robop'),btn=q('#robob');
let hist=[],busy2=false,sm;
const SYS='Сен — Robo, «AI Start» курсының (11 сынып: жасанды интеллект, цифрлық сауаттылық, стартап) достық робот-нұсқаушысысың. Кез келген тақырыптағы сұраққа түсінікті, қысқа (6 сөйлемге дейін) жауап бер. Қолданушы қай тілде жазса, сол тілде жауап бер (әдетте қазақша). Markdown белгілерін қолданба. Білмесең, соны ашық айт.';
function add(c,t){const d=document.createElement('div');d.className='rm '+c;d.textContent=t;box.appendChild(d);box.scrollTop=box.scrollHeight;return d;}
add('b','Сәлем! Мен — Robo. Кез келген сұрақ қой: курс туралы да, басқа тақырыпта да көмектесемін.');
async function ask(t){t=t.trim();if(!t||busy2)return;busy2=true;inp.value='';q('#rq').hidden=true;add('u',t);hist.push({role:'user',content:t});const bd=add('b','…');
  try{if(typeof claude==='undefined')throw {code:'na'};sm=sm||await claude.use('sample');if(!sm)throw {code:'na'};
    const ms=hist.slice(-9).map(x=>({role:x.role,content:x.content}));while(ms.length>1&&ms[0].role!=='user')ms.shift();ms[0].content=SYS+'\n\nСұхбат:\n'+ms[0].content;
    const r=await sm(ms,{cache:false,modelTier:'quick',onText:({text})=>{bd.textContent=text;box.scrollTop=box.scrollHeight;}});
    const a=(r&&r.text)||bd.textContent;bd.textContent=a;hist.push({role:'assistant',content:a});
  }catch(e){hist.pop();bd.textContent=e&&e.code==='not_granted'?'Чатты қосу үшін рұқсат беру керек. Қайта жазып көр.':e&&e.code==='rate_limited'?'Сәл күте тұр да, қайта сұра.':'Қазір жауап бере алмадым. Чат тек claude.ai-дағы жарияланған сілтеме арқылы ашқанда жұмыс істейді.';}
  busy2=false;}
btn.addEventListener('click',()=>{pan.hidden=!pan.hidden;btn.setAttribute('aria-expanded',String(!pan.hidden));if(!pan.hidden)inp.focus();});
q('#rx').addEventListener('click',()=>{pan.hidden=true;btn.setAttribute('aria-expanded','false');});
q('#rgo').addEventListener('click',()=>ask(inp.value));
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ask(inp.value);}});
q('#rq').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)ask(b.textContent);});
})();

updHead();updSound();route();
</script>
</body></html>
